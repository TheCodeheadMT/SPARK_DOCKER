# SPARK local release: runs SPARK on this computer with only Docker installed.
#
#   docker compose up -d        start (first start takes a few minutes), then open http://localhost:8000
#   docker compose restart      restart and update to the latest version
#   docker compose down         stop
#
# Every time the container starts it pulls the latest code from the repository
# (SPARK_REF, default main), rebuilds what changed and starts the app. Without a
# connection it starts the version it pulled last. Settings go in a .env file next
# to this one (see .env.example). Your data is kept in ./spark-data.
#
# Local mode has no sign-in, so the app is only reachable from this computer
# (127.0.0.1). Do not change that to share it on a network.

name: spark

services:
  spark:
    image: spark-local:bootstrap
    build:
      # Built from this folder of the public repository, so this file is all a user needs.
      # The image holds only the tools and a small bootstrap (Dockerfile, bootstrap.sh);
      # the app is pulled on every start. SPARK_BUILD_CONTEXT can point at a local folder
      # or a fork for testing.
      context: ${SPARK_BUILD_CONTEXT:-https://github.com/TheCodeheadMT/SPARK_DOCKER.git#main:deploy/local}
    container_name: spark
    ports:
      - "127.0.0.1:${SPARK_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed for the local release (these override .env):
      ENV: development
      AUTH_MODE: local
      DATA_DIR: /data
      SPARK_ENV_FILE: none
      # Defaults you can change in .env:
      BB_ROOT: ${BB_ROOT:-}                       # empty = upload exports in the app (no WebDAV)
      UPLOADS_ENABLED: ${UPLOADS_ENABLED:-true}
      ENABLE_FIXTURES: ${ENABLE_FIXTURES:-false}  # true = add the two synthetic demo courses
    volumes:
      - ./spark-data:/data     # courses, uploads, settings DB: back this folder up
      - spark-code:/opt/spark  # downloaded code, Python packages and web build (safe to delete)
    restart: unless-stopped

volumes:
  spark-code:
